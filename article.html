<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Подробная новость FLARE">
<title>Новость — FLARE</title>
<link rel="stylesheet" href="styles.css">
<style>
.articlePage{padding:46px 0 80px;max-width:1040px}
.articleBack{display:inline-flex;align-items:center;gap:8px;color:#e31b23;font-weight:800;font-size:13px;margin:0 0 22px;transition:.2s}.articleBack:hover{transform:translateX(-3px)}
.article{background:#fff;border:1px solid #e5e5e8;border-radius:24px;overflow:hidden;box-shadow:0 18px 60px rgba(12,13,16,.08)}
.articleHeader{padding:42px 56px 30px}.articleMeta{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:900}.articleMeta span{color:#e31b23}.articleMeta time{color:#96979c;text-transform:none;letter-spacing:0;font-weight:700}
.article h1{font-size:52px;line-height:1.02;letter-spacing:-2.3px;margin:0;max-width:900px;color:#0d0e11}
.articleLead{margin:20px 0 0;max-width:790px;font-size:18px;line-height:1.55;color:#717278}
.articleMedia{padding:0 56px}.articleImage{display:block;width:100%;height:auto;max-height:560px;object-fit:cover;border-radius:17px;background:#ececef}
.articleBody{max-width:790px;margin:34px 56px 0;font-size:18px;line-height:1.78;color:#292a2f}.articleBody p{margin:0 0 21px;white-space:pre-wrap}.articleBody p:first-child:first-letter{font-size:54px;font-weight:900;float:left;line-height:.82;padding:7px 9px 0 0;color:#e31b23}
.articleFooter{max-width:928px;margin:36px 56px 0;padding:20px 0 28px;border-top:1px solid #e7e7ea;display:flex;justify-content:space-between;align-items:center;gap:15px;color:#999;font-size:10px;font-weight:900;letter-spacing:.1em}.articleFooter a{color:#e31b23;letter-spacing:0;font-size:12px;background:#fff4f4;padding:10px 13px;border-radius:8px;transition:.2s}.articleFooter a:hover{background:#ffe7e8}
.articleLoading,.articleError{padding:70px 25px;text-align:center;color:#777}.articleError h2{color:#111}
.telegramCardClickable{cursor:pointer}.telegramCardClickable:focus{outline:3px solid rgba(227,27,35,.18);outline-offset:2px}.articleMore{color:#e31b23!important;font-size:11px!important;letter-spacing:0!important}
@media(max-width:700px){.articlePage{padding:28px 0 50px}.article{border-radius:17px}.articleHeader{padding:27px 21px 22px}.article h1{font-size:34px;letter-spacing:-1.2px}.articleLead{font-size:16px}.articleMedia{padding:0 21px}.articleImage{max-height:360px;border-radius:12px}.articleBody{margin:27px 21px 0;font-size:16px;line-height:1.68}.articleBody p:first-child:first-letter{font-size:43px}.articleFooter{margin:28px 21px 0;padding-bottom:21px;align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="logo" href="index.html">FLARE</a><nav><a href="index.html">Главная</a><a class="active" href="news.html">Новости</a><a href="schedule.html">Телепрограмма</a><a href="programs.html">Программы</a><a href="about.html">О канале</a></nav><button class="searchBtn" onclick="openSearch()">⌕</button></div></header>
<div class="ticker"><div class="wrap tickerInner"><strong>FLARE</strong><span>Новости</span><span>Главное за день</span><span>Прямой эфир</span><span class="tickerTime" id="clock">--:--</span></div></div>
<main class="wrap articlePage"><a class="articleBack" href="news.html">← Все новости</a><article id="article" class="article"><div class="articleLoading">Загружаем новость…</div></article></main>
<footer><div class="wrap footerGrid"><div><div class="logo">FLARE</div><p>Интернет-телеканал нового формата.</p></div><div><b>Разделы</b><a href="news.html">Новости</a><a href="schedule.html">Телепрограмма</a><a href="programs.html">Программы</a></div><div><b>Связь</b><a href="https://t.me/managerflareof" target="_blank" rel="noopener">Telegram: @managerflareof</a></div></div><div class="copy">© 2026 FLARE · 12+</div></footer>
<div id="search" class="overlay" onclick="closeSearch(event)"><div class="searchBox" onclick="event.stopPropagation()"><div class="searchTitle"><b>Поиск</b><button onclick="closeSearch()">×</button></div><input id="q" placeholder="Найти новости, программы..." oninput="searchSite()"><div id="results"></div></div></div>
<script src="script.js"></script>
<script>
(async function(){
 const root=document.getElementById('article'),params=new URLSearchParams(location.search),id=params.get('id'),manual=params.get('manual')==='1',index=Math.max(0,Math.min(2,Number(params.get('index')||0))),d=flareData();
 const esc=escHtml;
 function render(p,cat='FLARE · TELEGRAM'){
   const full=String(p.text||'Публикация FLARE').trim(), lines=full.split(/\n+/).map(x=>x.trim()).filter(Boolean), title=(lines[0]||full).slice(0,140), lead=lines.length>1?lines.slice(1,2).join(' '):'', date=p.time?new Date(p.time).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
   const image=p.image?'<div class="articleMedia"><img class="articleImage" src="'+esc(p.image)+'" alt=""></div>':'';
   const paragraphs=lines.map(x=>'<p>'+esc(x)+'</p>').join('');
   root.innerHTML='<div class="articleHeader"><div class="articleMeta"><span>'+esc(cat)+'</span><time>'+esc(date)+'</time></div><h1>'+esc(title)+'</h1>'+(lead?'<div class="articleLead">'+esc(lead)+'</div>':'')+'</div>'+image+'<div class="articleBody">'+paragraphs+'</div><div class="articleFooter"><span>FLARE</span><a href="https://t.me/flare_itv/'+encodeURIComponent(p.id||'')+'" target="_blank" rel="noopener">Открыть оригинал в Telegram →</a></div>';
   document.title=title+' — FLARE';
 }
 if(manual){
   const arr=[{title:d.newsTitle,text:d.newsText,meta:d.newsTime||'FLARE',cat:'Главное'},{title:d.news2Title,text:d.news2Text,meta:'FLARE',cat:d.news2Category||'Новости'},{title:d.news3Title,text:d.news3Text,meta:'FLARE',cat:d.news3Category||'Новости'}],p=arr[index];
   root.innerHTML='<div class="articleHeader"><div class="articleMeta"><span>'+esc(p.cat)+'</span><time>'+esc(p.meta)+'</time></div><h1>'+esc(p.title)+'</h1></div><div class="articleBody"><p>'+esc(p.text)+'</p></div><div class="articleFooter"><span>FLARE</span><a href="news.html">← Все новости</a></div>';
   document.title=p.title+' — FLARE'; return;
 }
 if(!id){root.innerHTML='<div class="articleError"><h2>Новость не найдена</h2><a href="news.html">Вернуться к новостям →</a></div>';return;}
 try{
   const r=await fetch('/api/telegram?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('API '+r.status);const data=await r.json(),p=(data.posts||[]).find(x=>String(x.id)===String(id));if(!p)throw new Error('not found');render(p);
 }catch(e){
   try{const r=await fetch('data/telegram.json?ts='+Date.now(),{cache:'no-store'}),data=await r.json(),p=(data.posts||[]).find(x=>String(x.id)===String(id));if(!p)throw new Error('not found');render(p)}catch(_){root.innerHTML='<div class="articleError"><h2>Не удалось загрузить новость</h2><p>Попробуйте обновить страницу или открыть канал FLARE.</p><a class="redBtn" href="https://t.me/flare_itv" target="_blank" rel="noopener">Открыть Telegram FLARE →</a></div>'}}
})();
</script>
</body>
</html>
