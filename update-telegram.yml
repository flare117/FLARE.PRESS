name: Update FLARE Telegram news

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch Telegram posts
        run: npm run update-telegram

      - name: Commit updated feed
        run: |
          git config user.name "FLARE Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/telegram.json
          if git diff --cached --quiet; then
            echo "No Telegram changes."
          else
            git commit -m "chore: update Telegram news"
            git push
          fi
