<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Погода Москвы и Московской области — FLARE</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="nav-menu.css"><link rel="stylesheet" href="market-weather.css"></head><body><header class="top"><div class="wrap nav"><a class="logo" href="index.html">FLARE</a><nav><a href="index.html">Главная</a><a href="news.html">Новости</a><a href="rates.html">Курс</a><a href="schedule.html">Телепрограмма</a><a href="about.html">О канале</a></nav></div></header><main class="wrap"><section class="section"><span class="eyebrow">FLARE / ПОГОДА</span><h1>Погода Москвы и Московской области</h1><p>Текущая погода по городам. Данные обновляются каждый час.</p><div class="weatherGrid" id="weatherGrid"><div class="weatherLoading">Загружаем погоду…</div></div><p id="weatherUpdated" class="weatherUpdated">Обновление…</p></section></main><script src="script.js"></script><script src="nav-menu.js"></script><script>const cities=[['Москва',55.7558,37.6173],['Химки',55.897,37.4297],['Красногорск',55.831,37.33],['Мытищи',55.9105,37.736],['Балашиха',55.7963,37.9382],['Королёв',55.9228,37.8544],['Подольск',55.4312,37.5458],['Люберцы',55.676,37.8981],['Одинцово',55.678,37.277],['Раменское',55.5671,38.2304],['Щёлково',55.9202,38.0008],['Коломна',55.0952,38.7656],['Сергиев Посад',56.3153,38.1353],['Дмитров',56.344,37.5208],['Ногинск',55.854,38.441],['Электросталь',55.7844,38.4448]];function icon(c){if(c===0)return'☀️';if(c<=3)return'⛅';if(c<=48)return'🌫️';if(c<=67)return'🌧️';if(c<=77)return'❄️';if(c<=82)return'🌦️';return'⛈️'}async function load(){const g=document.getElementById('weatherGrid'),u=document.getElementById('weatherUpdated');try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+cities.map(x=>x[1]).join(',')+'&longitude='+cities.map(x=>x[2]).join(',')+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Europe%2FMoscow',{cache:'no-store'});const d=await r.json(),a=Array.isArray(d)?d:[d];g.innerHTML=a.map((w,i)=>'<div class="weatherCard"><div class="weatherCity">'+cities[i][0]+'</div><div class="weatherMain"><span class="weatherIcon">'+icon(w.current.weather_code)+'</span><b>'+Math.round(w.current.temperature_2m)+'°</b></div><div class="weatherMeta">Ощущается '+Math.round(w.current.apparent_temperature)+'° · ветер '+Math.round(w.current.wind_speed_10m)+' м/с</div></div>').join('');u.textContent='Обновлено '+new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit'})+' МСК'}catch{g.innerHTML='<div class="weatherLoading">Погода временно недоступна.</div>'}}load();setInterval(load,3600000);</script></body></html>
