<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>404 — FLARE</title>
<style>
:root{--red:#e31b23;--line:rgba(255,255,255,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090b;color:#fff;font-family:Inter,Arial,sans-serif}body{min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}.bg{position:fixed;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.2s ease;z-index:0;transform:scale(1.02)}.bg.active{opacity:1}.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.58)),radial-gradient(circle at 50% 45%,rgba(0,0,0,.06),rgba(0,0,0,.58));z-index:1}.page{position:relative;z-index:2;width:min(860px,calc(100% - 34px));padding:44px 34px 36px;text-align:center;background:rgba(7,8,10,.48);border:1px solid rgba(255,255,255,.14);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.42);backdrop-filter:blur(10px)}.logo{font-weight:950;font-size:38px;letter-spacing:-3px;margin-bottom:46px;text-shadow:0 2px 20px rgba(0,0,0,.45)}.code{font-size:12px;letter-spacing:.2em;color:#ff4750;font-weight:900;margin-bottom:18px}.line{width:58px;height:3px;background:var(--red);margin:0 auto 28px;box-shadow:0 0 22px rgba(227,27,35,.7)}.title{font-size:clamp(38px,6.6vw,72px);line-height:.98;letter-spacing:-3px;margin:0 auto 24px;max-width:780px;text-shadow:0 3px 28px rgba(0,0,0,.6)}.text{font-size:17px;line-height:1.65;color:#e0e2e5;max-width:650px;margin:0 auto;text-shadow:0 2px 14px rgba(0,0,0,.65)}.text a{color:#fff;font-weight:800;text-decoration:none;border-bottom:1px solid var(--red)}.text a:hover{color:#ff6a70}.footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:#d0d2d5;font-size:11px;letter-spacing:.08em}.dots{display:flex;justify-content:center;gap:7px;margin-top:18px}.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.38);transition:.35s}.dot.active{background:#fff;transform:scale(1.3)}@media(max-width:600px){.page{padding:34px 22px 28px;border-radius:20px}.logo{margin-bottom:34px}.title{letter-spacing:-2px}.text{font-size:15px}.footer{margin-top:34px}}
</style>
</head>
<body>
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div class="shade"></div>
<main class="page">
  <div class="logo">FLARE</div><div class="code">ERROR 404</div><div class="line"></div>
  <h1 class="title">Наш сайт на обновлении или просто отключён</h1>
  <p class="text">Друг (подруга), спасибо что заходишь на наш сайт.. Ноо, мы временно отключены или находимся на обновлении.<br><br>Почитай пока новости там — <a href="https://t.me/flare_itv" target="_blank" rel="noopener">t.me/flare_itv</a></p>
  <div class="footer">FLARE · ТЕЛЕКАНАЛ<div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div></div>
</main>
<script>
(async()=>{
  const sources=['/assets/404-bg-1.b64','/assets/404-bg-2a.b64','/assets/404-bg-2b.b64','/assets/404-bg-3.b64'];
  try{
    const parts=await Promise.all(sources.map(u=>fetch(u,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(u);return r.text()})));
    const imgs=[parts[0],parts[1]+parts[2],parts[3]].map(b64=>'data:image/webp;base64,'+b64.trim());
    const layers=[document.getElementById('bgA'),document.getElementById('bgB')],dots=[...document.querySelectorAll('.dot')];
    let index=0,front=0;
    layers[0].style.backgroundImage=`url("${imgs[0]}")`;layers[0].classList.add('active');
    setInterval(()=>{index=(index+1)%imgs.length;const next=1-front;layers[next].style.backgroundImage=`url("${imgs[index]}")`;layers[next].classList.add('active');layers[front].classList.remove('active');front=next;dots.forEach((d,i)=>d.classList.toggle('active',i===index));},5000);
  }catch(e){console.warn('404 slideshow assets unavailable',e)}
})();
</script>
</body></html>
