<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLARE — Панель работника</title><style>body{margin:0;background:#090a0c;color:#f5f5f7;font:15px Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:30px 20px}.card{background:#15171b;border:1px solid #292c32;border-radius:18px;padding:24px;margin:16px 0}h1{margin:5px 0 8px;font-size:32px}h2{margin-top:0}label{display:block;margin:14px 0;color:#aaa;font-size:13px}input,textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border-radius:10px;border:1px solid #34373e;background:#0d0f12;color:#fff}textarea{min-height:80px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#e31b23;color:#fff;font-weight:800;cursor:pointer}.ghost{background:#292c32}.msg{margin-left:12px;color:#8be28b}@media(max-width:700px){.grid{grid-template-columns:1fr}}#panel{display:none}.top{display:flex;justify-content:space-between;align-items:center}.muted{color:#92959d}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main class="wrap"><section id="loginBox" class="card"><b>FLARE / WORKER</b><h1>Панель работника</h1><p class="muted">Управление сеткой вещания. Изменения сохраняются на сервере.</p><form id="loginForm"><label>Логин<input id="login" required></label><label>Пароль<input id="password" type="password" required></label><button class="btn">Войти</button><p id="loginError"></p></form></section><section id="panel"><div class="top"><div><b>FLARE / WORKER</b><h1>Сетка вещания</h1></div><button class="btn ghost" id="logout">Выйти</button></div><div class="card"><h2>Сейчас в эфире</h2><label>Название<input id="onairTitle"></label><label>Описание<textarea id="onairText"></textarea></label></div><div class="card"><h2>Следующая передача</h2><div class="grid"><label>Время<input id="nextTime" placeholder="10:25"></label><label>Название<input id="nextTitle"></label></div></div><div class="card"><h2>Сетка</h2><div class="grid"><label>Время 1<input id="sch1Time"></label><label>Передача 1<input id="sch1Title"></label><label>Время 2<input id="sch2Time"></label><label>Передача 2<input id="sch2Title"></label><label>Время 3<input id="sch3Time"></label><label>Передача 3<input id="sch3Title"></label><label>Время 4<input id="sch4Time"></label><label>Передача 4<input id="sch4Title"></label></div></div><div class="row"><button class="btn" id="save">Сохранить сетку</button><span id="status" class="msg"></span></div></section></main><script src="worker.js"></script></body></html>
