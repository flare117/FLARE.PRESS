<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Подробная новость FLARE">
<title>Новость — FLARE</title>
<link rel="stylesheet" href="styles.css">
<style>
.articlePage{padding:42px 0 70px;max-width:980px}.articleBack{display:inline-flex;align-items:center;color:#e31b23;font-weight:850;font-size:13px;margin-bottom:24px}.article{background:#fff;border:1px solid #e3e3e6;border-radius:20px;padding:38px 46px;box-shadow:0 12px 40px rgba(0,0,0,.055)}.articleMeta{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:850}.articleMeta span{color:#e31b23}.articleMeta time{color:#929399;text-transform:none;letter-spacing:0}.article h1{font-size:44px;line-height:1.05;letter-spacing:-1.7px;margin:0 0 28px;max-width:850px}.articleImage{display:block;width:100%;max-height:520px;object-fit:cover;border-radius:14px;margin:0 0 30px;background:#eee}.articleBody{max-width:780px;font-size:18px;line-height:1.75;color:#34353a}.articleBody p{margin:0 0 18px;white-space:pre-wrap}.articleFooter{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:34px;padding-top:20px;border-top:1px solid #e8e8eb;color:#999;font-size:11px;font-weight:850;letter-spacing:.08em}.articleFooter a{color:#e31b23;letter-spacing:0;font-size:12px}.articleLoading,.articleError{padding:50px 20px;text-align:center;color:#777}.articleError h2{color:#111}.telegramCardClickable{cursor:pointer}.telegramCardClickable:focus{outline:3px solid rgba(227,27,35,.18);outline-offset:2px}.articleMore{color:#e31b23!important;font-size:11px!important;letter-spacing:0!important}@media(max-width:700px){.articlePage{padding:28px 0 50px}.article{padding:25px 20px;border-radius:16px}.article h1{font-size:31px;letter-spacing:-1px}.articleBody{font-size:16px;line-height:1.65}.articleImage{max-height:360px}.articleFooter{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="logo" href="index.html">FLARE</a><nav><a href="index.html">Главная</a><a class="active" href="news.html">Новости</a><a href="schedule.html">Телепрограмма</a><a href="programs.html">Программы</a><a href="about.html">О канале</a></nav><button class="searchBtn" onclick="openSearch()">⌕</button></div></header>
<div class="ticker"><div class="wrap tickerInner"><strong>FLARE</strong><span>Новости</span><span>Главное за день</span><span>Прямой эфир</span><span class="tickerTime" id="clock">--:--</span></div></div>
<main class="wrap articlePage"><a class="articleBack" href="news.html">← Все новости</a><article id="article" class="article"><div class="articleLoading">Загружаем новость…</div></article></main>
<footer><div class="wrap footerGrid"><div><div class="logo">FLARE</div><p>Интернет-телеканал нового формата.</p></div><div><b>Разделы</b><a href="news.html">Новости</a><a href="schedule.html">Телепрограмма</a><a href="programs.html">Программы</a></div><div><b>Связь</b><a href="https://t.me/managerflareof" target="_blank" rel="noopener">Telegram: @managerflareof</a></div></div><div class="copy">© 2026 FLARE · 12+</div></footer>
<div id="search" class="overlay" onclick="closeSearch(event)"><div class="searchBox" onclick="event.stopPropagation()"><div class="searchTitle"><b>Поиск</b><button onclick="closeSearch()">×</button></div><input id="q" placeholder="Найти новости, программы..." oninput="searchSite()"><div id="results"></div></div></div>
<script src="script.js"></script>
<script>
(async function(){
 const root=document.getElementById('article'),params=new URLSearchParams(location.search),id=params.get('id'),manual=params.get('manual')==='1',index=Math.max(0,Math.min(2,Number(params.get('index')||0))),d=flareData();
 const esc=escHtml;
 function render(p,cat='FLARE · TELEGRAM'){
   const full=String(p.text||'Публикация FLARE').trim(), title=(full.split(/\n+/)[0]||full).slice(0,140), date=p.time?new Date(p.time).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
   const image=p.image?'<img class="articleImage" src="'+esc(p.image)+'" alt="">':'';
   const paragraphs=full.split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>'<p>'+esc(x)+'</p>').join('');
   root.innerHTML='<div class="articleMeta"><span>'+esc(cat)+'</span><time>'+esc(date)+'</time></div><h1>'+esc(title)+'</h1>'+image+'<div class="articleBody">'+paragraphs+'</div><div class="articleFooter"><span>FLARE</span><a href="https://t.me/flare_itv/'+encodeURIComponent(p.id||'')+'" target="_blank" rel="noopener">Открыть оригинал в Telegram →</a></div>';
   document.title=title+' — FLARE';
 }
 if(manual){
   const arr=[{title:d.newsTitle,text:d.newsText,meta:d.newsTime||'FLARE',cat:'Главное'},{title:d.news2Title,text:d.news2Text,meta:'FLARE',cat:d.news2Category||'Новости'},{title:d.news3Title,text:d.news3Text,meta:'FLARE',cat:d.news3Category||'Новости'}],p=arr[index];
   root.innerHTML='<div class="articleMeta"><span>'+esc(p.cat)+'</span><time>'+esc(p.meta)+'</time></div><h1>'+esc(p.title)+'</h1><div class="articleBody"><p>'+esc(p.text)+'</p></div><div class="articleFooter"><span>FLARE</span><a href="news.html">← Все новости</a></div>';
   document.title=p.title+' — FLARE'; return;
 }
 if(!id){root.innerHTML='<div class="articleError"><h2>Новость не найдена</h2><a href="news.html">Вернуться к новостям →</a></div>';return;}
 try{
   const r=await fetch('/api/telegram?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('API '+r.status);const data=await r.json(),p=(data.posts||[]).find(x=>String(x.id)===String(id));if(!p)throw new Error('not found');render(p);
 }catch(e){
   try{const r=await fetch('data/telegram.json?ts='+Date.now(),{cache:'no-store'}),data=await r.json(),p=(data.posts||[]).find(x=>String(x.id)===String(id));if(!p)throw new Error('not found');render(p)}catch(_){root.innerHTML='<div class="articleError"><h2>Не удалось загрузить новость</h2><p>Попробуйте обновить страницу или открыть канал FLARE.</p><a class="redBtn" href="https://t.me/flare_itv" target="_blank" rel="noopener">Открыть Telegram FLARE →</a></div>'}}
})();
</script>
</body>
</html>
