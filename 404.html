<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NEXTV — Глобальное обновление</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#05070b;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0%,#182638 0%,#0b111b 40%,#05070b 80%)}body:before{content:'✦  ❄  ✧  ❄  ✦  ❄  ✧  ❄  ✦';position:fixed;inset:0;color:rgba(220,242,255,.13);font-size:18px;letter-spacing:38px;line-height:80px;pointer-events:none;overflow:hidden}.card{position:relative;width:min(760px,calc(100% - 32px));padding:58px 42px 52px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(10,15,23,.9);box-shadow:0 30px 90px rgba(0,0,0,.5);backdrop-filter:blur(20px)}.logo{font-size:clamp(52px,10vw,88px);font-weight:950;letter-spacing:-6px;line-height:1;margin-bottom:24px}.title{font-size:clamp(24px,4vw,42px);font-weight:900;letter-spacing:-1.5px;text-transform:uppercase}.sub{margin-top:12px;color:#aeb9c7;font-size:14px;letter-spacing:.08em}.countLabel{margin-top:38px;color:#f0c86a;font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}.count{margin-top:12px;font-size:clamp(28px,6vw,52px);font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}.date{margin-top:16px;color:#778495;font-size:12px}.accent{width:70px;height:4px;margin:30px auto 0;border-radius:99px;background:linear-gradient(90deg,#e53935,#f0c86a)}@media(max-width:600px){.card{padding:42px 20px 38px;border-radius:22px}.logo{letter-spacing:-4px}.count{font-size:28px}.sub{line-height:1.5}}
</style>
</head>
<body>
<main class="card">
<div class="logo">NEXTV</div>
<div class="title">ГЛОБАЛЬНОЕ ОБНОВЛЕНИЕ К 1 ДЕКАБРЯ</div>
<div class="sub">Сайт готовится к большому обновлению</div>
<div class="countLabel">Осталось:</div>
<div class="count" id="countdown">Загрузка…</div>
<div class="date">1 декабря 2026 · 00:00 (Москва)</div>
<div class="accent"></div>
</main>
<script>
(function(){const target=new Date('2026-12-01T00:00:00+03:00').getTime();const el=document.getElementById('countdown');function update(){const diff=target-Date.now();if(diff<=0){el.textContent='ОБНОВЛЕНИЕ ЗАПУЩЕНО';return}const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000);el.textContent=d+' дн. '+String(h).padStart(2,'0')+' ч. '+String(m).padStart(2,'0')+' мин. '+String(s).padStart(2,'0')+' сек.'}update();setInterval(update,1000)})();
</script>
</body>
</html>
